name: OTA Update

# Ships a JS-only change to phones already running the app, without building an APK.
#
# Run this manually and give it a message describing what changed. The app checks on
# launch (checkAutomatically ON_LOAD) and applies the update on the launch after that.
#
# This does NOT replace the APK build. runtimeVersion is "fingerprint", so an update
# only reaches builds whose native code matches. Anything that changes the fingerprint
# — a new native module, an SDK bump, the app icon, app.json native config — needs a
# new APK from android-release.yml instead. This workflow prints the fingerprint so you
# can see when that has happened.
#
# Requires repo secret EXPO_TOKEN (the same one android-release.yml uses).

on:
  workflow_dispatch:
    inputs:
      message:
        description: "What changed (shows in the EAS dashboard)"
        required: true
      channel:
        description: "Which channel to publish to"
        required: true
        default: production
        type: choice
        options:
          - production
          - dev

# An update publishes to a channel that phones poll; two overlapping runs would race
# to be the newest. Let an in-flight run finish rather than cancelling it half-published.
concurrency:
  group: ota-${{ inputs.channel }}
  cancel-in-progress: false

# Needed to push the ota-* tag that records what shipped.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22, not 20: eas-cli pulls @oclif/plugin-autocomplete, which requires
      # >=22, so installing the CLI on 20 fails outright.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # An OTA goes straight to the client with no review step and no store rollback,
      # so the checks that gate a release gate this too.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx jest --ci

      # Recorded for the tag below: an update only lands on builds with this exact
      # fingerprint. If it differs from the APK the client is running, the update
      # publishes fine and silently never arrives — this is where you'd see why.
      - name: Show runtime fingerprint
        id: fingerprint
        continue-on-error: true
        run: |
          # fingerprint:generate prints the whole source list as JSON; only .hash is
          # the runtime version. Taking the raw output put several hundred KB of JSON
          # into the tag message and broke the summary step's shell.
          FP=$(npx expo-updates fingerprint:generate --platform android 2>/dev/null \
            | tail -1 | jq -r '.hash // empty' || true)
          echo "Fingerprint: ${FP:-unknown}"
          echo "value=$FP" >> "$GITHUB_OUTPUT"

      # The message is free text from whoever ran the workflow, so it goes through the
      # environment rather than being interpolated into the shell command.
      - name: Publish update
        id: publish
        env:
          UPDATE_BRANCH: ${{ inputs.channel }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          eas update \
            --branch "$UPDATE_BRANCH" \
            --message "$UPDATE_MESSAGE" \
            --platform android \
            --non-interactive \
            --json > update.json
          cat update.json
          # --json emits either a single update or one per platform; take the first
          # and don't let a shape change fail a run that already published.
          node .github/workflows/parse-update.js

      # The record you asked for: every published update leaves an annotated tag on the
      # exact commit that shipped, so `git tag --list 'ota-*'` is the history of what the
      # client's phone has actually received, and `git show <tag>` says when and why.
      #
      # Named ota-* rather than v* on purpose — android-release.yml triggers on v* tags,
      # and an OTA must never kick off an APK build.
      - name: Tag the commit this update shipped from
        env:
          UPDATE_BRANCH: ${{ inputs.channel }}
          UPDATE_MESSAGE: ${{ inputs.message }}
          UPDATE_ID: ${{ steps.publish.outputs.id }}
          UPDATE_GROUP: ${{ steps.publish.outputs.group }}
          RUNTIME_VERSION: ${{ steps.publish.outputs.runtime }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
        run: |
          TAG="ota-${UPDATE_BRANCH}-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Built in a file so the message keeps its own formatting instead of the
          # workflow's indentation, and so nothing in it is re-parsed by the shell.
          {
            echo "OTA update to ${UPDATE_BRANCH}"
            echo ""
            echo "${UPDATE_MESSAGE}"
            echo ""
            echo "Published:   $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Commit:      ${GITHUB_SHA}"
            echo "Update ID:   ${UPDATE_ID:-unknown}"
            echo "Group:       ${UPDATE_GROUP:-unknown}"
            echo "Runtime:     ${RUNTIME_VERSION:-unknown}"
            echo "Fingerprint: ${FINGERPRINT:-unknown}"
            echo "Run:         ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > tag-message.txt

          git tag -a "$TAG" -F tag-message.txt
          git push origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # Every value reaches the shell through the environment. Interpolating ${{ }}
      # directly into a run block pastes the value into the script itself, so one
      # bracket or quote in it is a syntax error — which is exactly what a raw
      # fingerprint blob did here on the first successful publish.
      - name: Summary
        if: always()
        env:
          UPDATE_BRANCH: ${{ inputs.channel }}
          UPDATE_MESSAGE: ${{ inputs.message }}
          UPDATE_ID: ${{ steps.publish.outputs.id }}
          RUNTIME_VERSION: ${{ steps.publish.outputs.runtime }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
        run: |
          {
            echo "## OTA update → \`${UPDATE_BRANCH}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Message | ${UPDATE_MESSAGE} |"
            echo "| Tag | \`${TAG:-not tagged}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Update ID | \`${UPDATE_ID:-unknown}\` |"
            echo "| Runtime | \`${RUNTIME_VERSION:-unknown}\` |"
            echo "| Fingerprint | \`${FINGERPRINT:-unknown}\` |"
            echo ""
            echo "Phones on a matching fingerprint pick this up on next launch."
          } >> "$GITHUB_STEP_SUMMARY"
