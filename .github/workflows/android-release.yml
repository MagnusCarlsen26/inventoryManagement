name: Android APK Release

# Production builds start manually from master. A successful build automatically
# creates a unique tag and a GitHub Release with the APK attached.
# Requires repo secret EXPO_TOKEN (Expo access token).

on:
  workflow_dispatch:

concurrency:
  group: apk-release-version
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require master branch
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Run production releases from master." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      # Node 22, not 20: eas-cli pulls @oclif/plugin-autocomplete, which requires
      # >=22, so installing the CLI on 20 fails outright.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK on EAS (cloud) and download artifact
        id: build
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > build.json
          cat build.json
          BUILD_ID=$(node -e "const b=require('./build.json'); const x=Array.isArray(b)?b[0]:b; console.log(x.id||'')")
          APK_URL=$(node -e "const b=require('./build.json'); const x=Array.isArray(b)?b[0]:b; const a=x.artifacts||{}; console.log(a.applicationArchiveUrl||a.buildUrl||'')")
          test -n "$BUILD_ID"
          echo "Artifact URL: $APK_URL"
          test -n "$APK_URL"

          RELEASE_TAG=$(node .github/workflows/next-version.js)
          APK_NAME="Topolina-production-${RELEASE_TAG}.apk"
          EAS_BUILD_URL="https://expo.dev/accounts/khushalsindhav/projects/inventoryManagement/builds/${BUILD_ID}"
          curl --fail --location --output "./$APK_NAME" "$APK_URL"
          ls -la "./$APK_NAME"
          {
            echo "release_tag=$RELEASE_TAG"
            echo "apk_name=$APK_NAME"
            echo "eas_build_url=$EAS_BUILD_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK
        id: release
        uses: softprops/action-gh-release@v3
        with:
          files: ./${{ steps.build.outputs.apk_name }}
          tag_name: ${{ steps.build.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Production APK for commit `${{ github.sha }}`.

            [View the EAS build](${{ steps.build.outputs.eas_build_url }})
          generate_release_notes: true

      - name: Summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RELEASE_TAG: ${{ steps.build.outputs.release_tag }}
          EAS_BUILD_URL: ${{ steps.build.outputs.eas_build_url }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          {
            echo "## Production APK"
            echo ""
            if [ "$RELEASE_OUTCOME" = "success" ]; then
              echo "- Tag: \`$RELEASE_TAG\`"
              echo "- Download: [GitHub Release]($RELEASE_URL)"
              echo "- Build details: [EAS build]($EAS_BUILD_URL)"
            elif [ "$BUILD_OUTCOME" = "success" ]; then
              echo "The APK was built, but publishing its GitHub Release failed."
              echo ""
              echo "Build details: [EAS build]($EAS_BUILD_URL)"
            else
              echo "No production release was published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
