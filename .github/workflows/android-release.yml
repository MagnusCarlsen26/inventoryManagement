name: Android APK Release

# Two ways to cut a release, both producing a GitHub Release with the APK attached:
#   1. Push a tag:  git tag v1.0.0 && git push origin v1.0.0
#   2. Run this workflow manually and pass the tag to create.
# Requires repo secret EXPO_TOKEN (Expo access token).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create for this release (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK on EAS (cloud) and download artifact
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > build.json
          cat build.json
          APK_URL=$(node -e "const b=require('./build.json'); const x=Array.isArray(b)?b[0]:b; const a=x.artifacts||{}; console.log(a.applicationArchiveUrl||a.buildUrl||'')")
          echo "Artifact URL: $APK_URL"
          test -n "$APK_URL"
          curl -L -o ./app-release.apk "$APK_URL"
          ls -la ./app-release.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: ./app-release.apk
          # On a tag push github.ref_name is the tag; on a manual run it is the branch,
          # so take the tag from the input instead and let the action create it.
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
